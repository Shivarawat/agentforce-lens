version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: agentforce-lens-pg
    environment:
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: lens_secret
      POSTGRES_DB: agentforce_lens
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agentforce-lens-redis
    ports:
      - '6379:6379'

volumes:
  pg_data:
